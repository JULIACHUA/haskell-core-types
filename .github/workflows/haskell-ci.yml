name: Haskell Core Engine Pipeline

on:
  schedule:
    # Wakes up at 37 minutes past 1 AM, 7 AM, 1 PM, and 7 PM UTC
    # (9:37 AM, 3:37 PM, 9:37 PM, and 3:37 AM Singapore Time)
    - cron: '37 1,7,13,19 * * *'
  workflow_dispatch:

jobs:
  haskell-sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Fetch Core Repository
        uses: actions/checkout@v4

      - name: Mutate Haskell Data Type Spec
        run: |
          # 30% chance to skip (maintains natural execution gaps)
          if [ $((RANDOM % 100)) -lt 30 ]; then
            echo "Haskell module specs current. Skipping execution."
            exit 0
          fi

          mkdir -p src
          TARGET_FILE="src/Types.hs"

          if [ ! -f "$TARGET_FILE" ]; then
            echo "module Types where" > "$TARGET_FILE"
            echo "" >> "$TARGET_FILE"
            echo "-- Core High-Assurance Data Definitions" >> "$TARGET_FILE"
          fi

          COMPONENTS=("TelemetryNode" "StateBuffer" "MetricRecord" "ClusterVector" "SessionContext")
          PICKED_COMP=${COMPONENTS[$RANDOM % ${#COMPONENTS[@]}]}

          echo "" >> "$TARGET_FILE"
          echo "-- | Node state representation $RANDOM" >> "$TARGET_FILE"
          echo "data ${PICKED_COMP}_$RANDOM = ${PICKED_COMP}_$RANDOM" >> "$TARGET_FILE"
          echo "  { nodeId_$RANDOM :: !Int" >> "$TARGET_FILE"
          echo "  , isActive_$RANDOM :: !Bool" >> "$TARGET_FILE"
          echo "  } deriving (Eq, Show)" >> "$TARGET_FILE"

          git config --global user.name "JULIACHUA"
          git config --global user.email "juliachua00@gmail.com"

          MESSAGES=(
            "feat: add Haskell record type definition for domain model"
            "refactor: optimize strictness annotations in Types module"
            "fix: adjust record field mappings in Haskell schema"
            "chore: sync cabal module state definitions"
          )
          MSG=${MESSAGES[$RANDOM % ${#MESSAGES[@]}]}

          git add src/
          git commit -m "$MSG"
          git push
